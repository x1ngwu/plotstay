server {
    listen 80;
    listen [::]:80;
    server_name plotstay.xingwu.dev;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 301 https://plotstay.xingwu.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plotstay.xingwu.dev;

    ssl_certificate /etc/ssl/cloudflare/xingwu.dev/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/xingwu.dev/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    access_log /var/log/nginx/plotstay.xingwu.dev.access.log;
    error_log /var/log/nginx/plotstay.xingwu.dev.error.log;

    auth_basic "Plotstay development";
    auth_basic_user_file /etc/nginx/auth/plotstay.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;

    # Public crawler instructions; every application route remains authenticated.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Isolated overview design artifacts. Inherits Basic Auth and private/noindex headers.
    # No application restart or database connection is required for this preview.
    location /_design/overview/ {
        alias /data/apps/plotstay/docs/workspace-handoff/overview-prototype/;
        index index.html;
        autoindex off;
    }

    # Independent persona interaction preview; no business APIs or database writes.
    # Inherits Basic Auth, noindex and private/no-store from this server.
    location /_design/personas/ {
        alias /data/apps/plotstay/docs/workspace-handoff/personas-prototype/;
        index index.html;
        autoindex off;
    }

    # Independent reviews interaction preview; no business APIs or database writes.
    # Inherits Basic Auth, noindex and private/no-store from this server.
    location /_design/reviews/ {
        alias /data/apps/plotstay/docs/workspace-handoff/reviews-prototype/;
        index index.html;
        autoindex off;
    }

    # Independent works/create interaction preview; synthetic data only.
    # Inherits Basic Auth, noindex and private/no-store from this server.
    location /_design/works/ {
        alias /data/apps/plotstay/docs/workspace-handoff/works-stage-a-20261014/;
        index index.html;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 60s;
    }
}
