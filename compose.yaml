name: plotstay
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: plotstay
      POSTGRES_USER: plotstay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plotstay -d plotstay"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:

